services:
  - type: web
    name: aegis-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AEGIS_BACKEND_HOST
        value: 0.0.0.0
      - key: AEGIS_BACKEND_PORT
        value: 8000
    disk:
      name: aegis-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: aegis-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aegis-backend
          property: host
