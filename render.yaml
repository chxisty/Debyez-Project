services:
  # Backend FastAPI Web Service
  - type: web
    name: aegis-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AEGIS_BACKEND_HOST
        value: 0.0.0.0
      - key: AEGIS_LLM_PROVIDER
        value: offline

  # Frontend Next.js Web Service
  - type: web
    name: aegis-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aegis-backend
          property: host
